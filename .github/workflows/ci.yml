name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  linux-build-and-test:
    name: Linux Build & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libx11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit test suite
        run: cargo test --verbose

      - name: Build native binary
        run: make linux

      - name: Run self-test verification suite
        run: |
          BIN=$(ls dist/disk* 2>/dev/null | head -n 1)
          "$BIN" --verify .

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: disksonar-linux-x86_64
          path: dist/disksonar
          if-no-files-found: error

  windows-cross-compile:
    name: Windows Cross-Compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libx11-dev gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Install Rust toolchain with Windows target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Build Windows executable
        run: make windows

      - name: Build Windows installer
        run: ./scripts/build_installer.sh

      - name: Verify Windows output artifacts
        run: |
          test -f dist/*.exe
          ls -lh dist/*.exe

      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskSonar-windows-x86_64
          path: dist/DiskSonar.exe
          if-no-files-found: error

  hygiene:
    name: Code & Documentation Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for disallowed em dashes
        run: |
          echo "Scanning markdown and source files for em dashes..."
          ! grep -rn "—" Sources/ src/ docs/ README.md Packaging/ ARCHITECTURE.md CHANGELOG.md CONTRIBUTING.md SECURITY.md
