[package]
name = "diskdude"
version = "1.0.0"
edition = "2021"
description = "Native ultra-lightweight disk space analyzer with 9 visualizations and safe Trash cleanup"

[[bin]]
name = "diskdude"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
